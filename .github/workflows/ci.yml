# The kit's merge gate: the tests a change reaches, the scrub and a fresh build. The PR body has its own workflow
# (pr-body.yml), so a body edit reruns only that. The suite on Linux; the Windows-only tests and the guard proofs on
# Windows (E31). T15 (the owner's pick 2026-11-12, "Only what it touches"): a PR runs the tests its change reaches and
# the security set; every push to main runs the whole suite and saves the coverage map the next PR selects by.
# Actions are pinned to full commit SHAs, so a moved tag cannot change what runs here.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # E31: the suite runs on Linux, where it took 22 s against about 7 minutes on Windows (8 shards on the owner's PC,
  # 2026-11-09). The tests marked { windows: true } run on Windows (below), and are skipped here.
  unit-tests:
    needs: [lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read finds main's run and its coverage map for a PR.
    permissions:
      contents: read
      actions: read
    # The runners: lanes sizes them from the map's measured time, and each runs its slice of the suite.
    strategy:
      matrix: ${{ fromJSON(needs.lanes.outputs.unit) }}
      fail-fast: false
    # H1: a matrix or lanes value reaches a run line only through these, and each run checks it as an integer first.
    env:
      SHARD: ${{ matrix.shard }}
      UNIT_N: ${{ needs.lanes.outputs.unit_n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests read the v1.1.0 tag, and the version check diffs against main.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The temp repos the tests make need a commit identity, and main as the default branch, as on the owner's machine.
      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # K128 (build 17): the spawn check below judges this PR, so it runs the base commit's copy, unpacked before any of
      # the PR's code runs.
      - name: The base commit's scripts
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A replace ref would hand the PR's own blob back as the base's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          # Git for Windows' tar reads "D:" in a Windows path as a host (PR 53), so it gets the path in its own form.
          B="$RUNNER_TEMP/base"; command -v cygpath > /dev/null && B="$(cygpath -u "$B")"
          mkdir -p "$B"
          git archive "$BASE_SHA" scripts project tests user | tar -x -C "$B"

      # Build 23 (K212-K214 and their class; the owner's pick 2026-11-21): every launch of a program by its bare name in
      # the files install copies starts from node's own folder, where Windows cannot find a git.exe or gh.exe the agent
      # left in a project. No list of sites it lets through.
      - name: Spawn check
        shell: bash
        run: |
          S="$RUNNER_TEMP/base/scripts/spawn-check.mjs"; [ -f "$S" ] || { echo "the base has no spawn-check.mjs: this PR's copy runs"; S=scripts/spawn-check.mjs; }
          node "$S" .

      # Push to main: this runner's slice of every test, through the guarded runner, recording its part of the coverage map.
      # The map-merge job joins the parts into the whole map.
      - name: Every test, with the coverage map
        if: github.event_name != 'pull_request'
        run: |
          [[ "$SHARD" =~ ^[0-9]+$ && "$UNIT_N" =~ ^[0-9]+$ ]] || { echo "the shard values are not integers" >&2; exit 1; }
          node scripts/test-run.mjs --map --slice "$SHARD/$UNIT_N" --shards 4

      - name: Keep the coverage map part
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-map-part-${{ matrix.shard }}
          path: tests/.map-part-${{ matrix.shard }}.json
          include-hidden-files: true
          retention-days: 30

      # A PR: the map from main's own push run of the PR's base commit, found through the API. Not the Actions cache:
      # a PR's earlier run can write a cache entry under any key, and the PR's own entries are read first. No such
      # run, or no map in it, and the PR runs every test.
      - name: Load the coverage map for the base commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -f tests/.map.json
          run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --commit "$BASE_SHA" --json databaseId,headSha,event,headBranch --jq "[.[] | select(.headSha == \"$BASE_SHA\" and .event == \"push\" and .headBranch == \"main\")][0].databaseId // empty")" || run_id=""
          if [ -n "$run_id" ]; then gh run download "$run_id" --repo "$REPO" --name test-map --dir tests || rm -f tests/.map.json; fi
          echo "map from main's run: ${run_id:-none}"

      # Changed, or the whole suite when the selection has nothing sound to stand on (no map for the base, a deleted
      # file, a change to a workflow, the runner, the harness or the map tracer).
      - name: What this PR runs
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The base's own selection rule, never the PR's copy, which could drop itself from the risky list (K9).
          git show "$BASE_SHA:scripts/pr-scope.mjs" > "$RUNNER_TEMP/pr-scope.mjs" 2>/dev/null || printf '%s\n' 'process.stdout.write("scope=full\nwhy=the base has no pr-scope\n")' > "$RUNNER_TEMP/pr-scope.mjs"
          node "$RUNNER_TEMP/pr-scope.mjs" "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      # E36 (build 24): each step's model, effort and floor must agree with its role file and script, so a drifted role
      # file fails the PR. This runs the PR's own copy of the table, so a PR can edit the table it is checked against. It
      # sits below the step that holds GH_TOKEN, so no PR code runs with that token in its environment.
      - name: Model table check
        shell: bash
        run: node user/kit-tools/model-table.mjs check .

      # E36/U9 (build 24): a release may not drop an enforced hold; this reads the holds against the latest release tag.
      # Report only, as the minimal-code job is: a failing hold prints its line, and this job still passes.
      - name: Hold check, report only
        shell: bash
        run: node user/kit-tools/hold-check.mjs . || echo "hold-check exit $? is report only, so this job still passes"

      - name: Every test
        if: github.event_name == 'pull_request' && steps.scope.outputs.scope != 'changed'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$SHARD" =~ ^[0-9]+$ && "$UNIT_N" =~ ^[0-9]+$ ]] || { echo "the shard values are not integers" >&2; exit 1; }
          # M11: the slices pack by the base map's times only when the map was loaded; --plan without it exits 2.
          plan=(); if [ -f tests/.map.json ]; then plan=(--plan "$BASE_SHA"); fi
          node scripts/test-run.mjs --shards 4 --slice "$SHARD/$UNIT_N" "${plan[@]}"

      # The security set runs on every PR whatever the change reaches (E32 rule 4: security tests never move for speed).
      # It joins the changed run (--always), so a security test the change reaches runs once (K105); over half the suite
      # reached, the runner runs every test.
      - name: The tests the change reaches
        if: github.event_name == 'pull_request' && steps.scope.outputs.scope == 'changed'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$SHARD" =~ ^[0-9]+$ && "$UNIT_N" =~ ^[0-9]+$ ]] || { echo "the shard values are not integers" >&2; exit 1; }
          plan=(); if [ -f tests/.map.json ]; then plan=(--plan "$BASE_SHA"); fi
          node scripts/test-run.mjs --changed --shards 4 --slice "$SHARD/$UNIT_N" "${plan[@]}" --always tests/guards-hold.test.mjs --always tests/guards-outside.test.mjs --always tests/owner-proof.test.mjs --always tests/task-gate.test.mjs --always tests/guard-dispatch.test.mjs --always tests/guard-prompts.test.mjs

  # T15 Part A: each test the PR adds or changes, held to the bar for a new test. Strict since K24 (the owner,
  # 2026-11-17): a finding fails the job; a test the time budget left unmeasured is named only.
  test-check:
    if: github.event_name == 'pull_request'
    needs: [lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The slices: lanes sizes them at one per 100 changed tests (K13): one machine ran past 15 minutes on a PR with 616.
    # K95: two slices of PR 47 still ran past it measuring flips and reported nothing; 12 minutes of budget leaves
    # room to set up and to report, and names each test it could not check.
    strategy:
      matrix: ${{ fromJSON(needs.lanes.outputs.check) }}
      fail-fast: false
    # H1: a matrix or lanes value reaches a run line only through these, and the run checks it as an integer first.
    env:
      SLICE: ${{ matrix.slice }}
      CHECK_N: ${{ needs.lanes.outputs.check_n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # K128 (build 17): the test check runs the base commit's copy, unpacked before any of the PR's code runs. It runs
      # the PR's tests itself, which then share its machine: that limit is named in the build record. The workflow file
      # itself still comes from the PR; the ruleset that stops that is the owner's (K31).
      - name: The base commit's scripts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A replace ref would hand the PR's own blob back as the base's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          # Git for Windows' tar reads "D:" in a Windows path as a host (PR 53), so it gets the path in its own form.
          B="$RUNNER_TEMP/base"; command -v cygpath > /dev/null && B="$(cygpath -u "$B")"
          mkdir -p "$B"
          git archive "$BASE_SHA" scripts project tests user | tar -x -C "$B"

      - name: Test check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # K105: a PR that moves VERSION carries its build record; each test its fix ledger names gets a verdict here.
        run: |
          [[ "$SLICE" =~ ^[0-9]+$ && "$CHECK_N" =~ ^[0-9]+$ ]] || { echo "the slice values are not integers" >&2; exit 1; }
          record=()
          if ! git diff --quiet "$BASE_SHA" HEAD -- VERSION; then record=(--record "docs/builds/$(tr -d '\r\n' < VERSION).json"); fi
          G="$RUNNER_TEMP/base"; [ -f "$G/scripts/test-check.mjs" ] || { echo "the base has no scripts/test-check.mjs: this PR's copy runs"; G=.; }
          node "$G/scripts/test-check.mjs" "$BASE_SHA" --strict --slice "$SLICE/$CHECK_N" --budget 120 "${record[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The one name the ruleset requires for the test check: it fails unless every slice passed, so the required check reports
  # whatever the slice count is. A slice that failed or was skipped fails it.
  test-check-all:
    name: "test-check (all)"
    if: always() && github.event_name == 'pull_request'
    needs: [lanes, test-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test-check slice passed
        if: needs.test-check.result != 'success'
        run: exit 1

  # On a push to main, the parts of the coverage map from the unit runners, joined into the whole map (map-merge.mjs)
  # that the next PR selects by and that sizes the jobs.
  map-merge:
    needs: [unit-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Join the map parts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'test-map-part-*' --dir "$RUNNER_TEMP/parts"
          mapfile -t parts < <(find "$RUNNER_TEMP/parts" -name '.map-part-*.json' | sort)
          node scripts/map-merge.mjs "${parts[@]}"

      - name: Keep the coverage map
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-map
          path: tests/.map.json
          include-hidden-files: true
          retention-days: 30

  # What only the owner's machine shows: drive paths, Git for Windows' sh running the git hooks, junctions; and the
  # guards' own proofs, since the guards guard a Windows machine.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Vendor paths are long; without this a deep checkout can pass the 260-character Windows limit.
      - run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The hook tests run `sh`; Git for Windows ships it in its bin folder (the runner's default branch is master).
      - name: Prepare the shell and git identity
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # The test check's Windows part (the owner, 2026-11-18): the Linux test check leaves the Windows-only tests and the
      # planted bugs that show only on Windows to this job, which measures them here, strict.
      # K128 (build 17): the test check runs the base commit's copy, unpacked before any of the PR's code runs. It runs
      # the PR's tests itself, which then share its machine: that limit is named in the build record. The workflow file
      # itself still comes from the PR; the ruleset that stops that is the owner's (K31).
      - name: The base commit's scripts
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A replace ref would hand the PR's own blob back as the base's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          # Git for Windows' tar reads "D:" in a Windows path as a host (PR 53), so it gets the path in its own form.
          B="$RUNNER_TEMP/base"; command -v cygpath > /dev/null && B="$(cygpath -u "$B")"
          mkdir -p "$B"
          git archive "$BASE_SHA" scripts project tests user | tar -x -C "$B"

      - name: Test check, Windows part
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          record=()
          if ! git diff --quiet "$BASE_SHA" HEAD -- VERSION; then record=(--record "docs/builds/$(tr -d '\r\n' < VERSION).json"); fi
          G="$RUNNER_TEMP/base"; [ -f "$G/scripts/test-check.mjs" ] || { echo "the base has no scripts/test-check.mjs: this PR's copy runs"; G=.; }
          node "$G/scripts/test-check.mjs" "$BASE_SHA" --strict --windows --budget 120 "${record[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Windows tests
        env:
          KIT_WINDOWS_SLICE: '1'
        run: node scripts/test-run.mjs --shards 2

      # The push guard's own proof: every command that must ask asks, every safe one passes.
      - name: Push guard proof
        run: node project/.claude/guard-outward-check.cjs

      # The delete guard's own proof: every delete outside the session's folder and the project asks.
      - name: Delete guard proof
        run: node project/.claude/guard-delete-check.cjs

  # E32 (option C, the owner 2026-11-10): two lanes on the same PR. The fast lane is unit-tests above; large tests
  # (another machine, a real service, a browser, a live model) live in tests/slow and run here, beside it. The slow
  # job is turned on by a job-level if on what this job finds, never by a path filter on the workflow, so a PR with no
  # slow test still gets a result for every required job.
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read finds the coverage map that sizes the jobs: the base commit's on a PR, the previous main push's on a push.
    permissions:
      contents: read
      actions: read
    outputs:
      slow: ${{ steps.find.outputs.slow }}
      install: ${{ steps.install.outputs.install }}
      unit: ${{ steps.size.outputs.unit }}
      unit_n: ${{ steps.size.outputs.unit_n }}
      check: ${{ steps.size.outputs.check }}
      check_n: ${{ steps.size.outputs.check_n }}
      mutation: ${{ steps.size.outputs.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: find
        shell: bash
        run: |
          if [ -n "$(find tests/slow -type f -name '*.test.mjs' 2>/dev/null | head -n 1)" ]; then echo "slow=true" >> "$GITHUB_OUTPUT"; else echo "slow=false" >> "$GITHUB_OUTPUT"; fi

      # T15 D1 and D2 run on every push to main, and on a PR only when it touches install or the guards (the owner's
      # pick 2026-11-12: no added time on the rest). A diff that cannot be read runs them.
      - id: install
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "install=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The base's own rule decides, never the PR's copy of it (K9): only files install never reads skip it (K8).
          # A base whose script has no install rule yet prints none, and the check runs.
          git show "$BASE_SHA:scripts/pr-scope.mjs" > "$RUNNER_TEMP/pr-scope.mjs" 2>/dev/null || true
          lane="$(node "$RUNNER_TEMP/pr-scope.mjs" --install "$BASE_SHA" 2>/dev/null | grep -E '^install=(true|false)$' || true)"
          echo "${lane:-install=true}" >> "$GITHUB_OUTPUT"

      # The map that sizes the jobs: the base commit's on a PR, the previous main push's on a push (its run, found through
      # the API, as the unit job finds the map it selects by). None found, the size step takes its fallback.
      - name: Coverage map for the sizing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SIZE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rm -f tests/.map.json
          run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --commit "$SIZE_SHA" --json databaseId,headSha,event,headBranch --jq "[.[] | select(.headSha == \"$SIZE_SHA\" and .event == \"push\" and .headBranch == \"main\")][0].databaseId // empty")" || run_id=""
          if [ -n "$run_id" ]; then gh run download "$run_id" --repo "$REPO" --name test-map --dir tests || rm -f tests/.map.json; fi
          echo "sizing map from main's run: ${run_id:-none}"

      # Runner and slice counts from the map's measured time (scripts/ci-size.mjs). H1: the BASE commit's copy runs, never the
      # PR's, with the base's test parser beside it; what it prints is checked below before any job reads it as a matrix. A PR
      # counts its changed tests with --base (new or changed tests, a loop as one); a push has none. No map, or a base copy
      # that cannot size (the base has no --base yet): four of each.
      - name: Size the jobs
        id: size
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # A replace ref would hand the PR's own blob back as the base's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          OUT="$RUNNER_TEMP/size.txt"
          fixed() { printf '%s\n' 'unit={"shard":[0,1,2,3]}' 'check={"slice":[0,1,2,3]}' 'mutation={"slice":[1]}' > "$OUT"; }
          if [ -f tests/.map.json ]; then
            S="$RUNNER_TEMP/size-base"; mkdir -p "$S/scripts"
            git archive "$BASE_SHA" scripts/test-check.mjs project/.claude/kit-temp.cjs user/kit-hooks/why-rule.cjs 2> /dev/null | tar -x -C "$S" || true
            git show "$BASE_SHA:scripts/ci-size.mjs" > "$S/scripts/ci-size.mjs" 2> /dev/null || rm -f "$S/scripts/ci-size.mjs"
            base=()
            if [ "$EVENT" = "pull_request" ]; then base=(--base "$BASE_SHA"); fi
            rm -f "$OUT"
            [ -f "$S/scripts/ci-size.mjs" ] && node "$S/scripts/ci-size.mjs" --map tests/.map.json "${base[@]}" --github-output "$OUT" || { echo "the base's ci-size could not size this run: four of each"; fixed; }
          else
            fixed
          fi
          unit="$(sed -n 's/^unit=//p' "$OUT")"
          check="$(sed -n 's/^check=//p' "$OUT")"
          mutation="$(sed -n 's/^mutation=//p' "$OUT")"
          # Each output is {"shard":[0,...]} or {"slice":[0,...]}, with 1 to 6 entries; anything else stops the run here.
          unit_re='^\{"shard":\[0(,[0-9]+)*\]\}$'
          check_re='^\{"slice":\[0(,[0-9]+)*\]\}$'
          mutation_re='^\{"slice":\[[0-9]+(,[0-9]+)*\]\}$'
          [[ "$unit" =~ $unit_re && "$check" =~ $check_re && "$mutation" =~ $mutation_re ]] || { echo "ci-size printed a plan of the wrong shape" >&2; exit 1; }
          unit_n="$(printf '%s' "$unit" | jq '.shard | length')"
          check_n="$(printf '%s' "$check" | jq '.slice | length')"
          for n in "$unit_n" "$check_n"; do
            [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -ge 1 ] && [ "$n" -le 6 ] || { echo "a plan of $n runners is not 1 to 6" >&2; exit 1; }
          done
          {
            echo "unit=$unit"
            echo "unit_n=$unit_n"
            echo "check=$check"
            echo "check_n=$check_n"
            echo "mutation=$mutation"
          } >> "$GITHUB_OUTPUT"

  # T15 D1 and D2: install, upgrade and the guards, on both systems the kit runs on.
  install-check:
    needs: [lanes]
    if: needs.lanes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The hooks the launcher runs are sh scripts; Git for Windows ships sh in its bin folder.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install check
        shell: bash
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
          node scripts/ci-install-check.mjs

  slow-tests:
    needs: [lanes]
    if: needs.lanes.outputs.slow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # A large test's own time limit is the large size's (900 s), not the fast lane's.
      - name: Slow tests
        shell: bash
        env:
          KIT_TEST_LIMIT_MS: '900000'
        run: |
          mapfile -t slow < <(find tests/slow -type f -name '*.test.mjs')
          node scripts/test-run.mjs "${slow[@]}"

  # K311 (owner call 5): the minimal-code job. On a PR it flips the production lines the PR added and names every flip no
  # test catches, within a 150 s budget (flip-plan.mjs runs the flips on parallel copies). Report only: it never fails the
  # run. It reuses the base commit's coverage map from that commit's push run, and builds none of its own.
  minimal-code:
    if: github.event_name == 'pull_request'
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # actions: read finds the base commit's push run and its coverage map.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Coverage map for the base commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -f tests/.map.json
          run_id="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --commit "$BASE_SHA" --json databaseId,headSha,event,headBranch --jq "[.[] | select(.headSha == \"$BASE_SHA\" and .event == \"push\" and .headBranch == \"main\")][0].databaseId // empty")" || run_id=""
          if [ -n "$run_id" ]; then gh run download "$run_id" --repo "$REPO" --name test-map --dir tests || rm -f tests/.map.json; fi
          echo "map from main's run: ${run_id:-none}"

      - name: Flips within the budget (report only)
        run: node scripts/flip-plan.mjs --base ${{ github.event.pull_request.base.sha }} --budget 150 || echo "flip-plan exit $? is report only, so this job still passes"

  # The required check. It runs even when a job it needs fails, and fails then: a job skipped because a job it needs
  # failed counts as passed for a required check. A slow lane skipped for having no test passes; one that ran must pass.
  kit-tests:
    # Every other job of this run is in needs, except minimal-code, which the time budget skips by name.
    needs: [unit-tests, windows-tests, lanes, slow-tests, install-check, map-merge, test-check, test-check-all]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the time budget list this run's jobs.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every test job passed
        if: needs.unit-tests.result != 'success' || needs.windows-tests.result != 'success' || needs.lanes.result != 'success' || (needs.slow-tests.result != 'success' && needs.slow-tests.result != 'skipped') || (needs.map-merge.result != 'success' && needs.map-merge.result != 'skipped')
        run: exit 1

      # Skipped only when the lanes job found no install or guard change; one that ran must pass.
      - name: The install check passed or was not owed
        if: (needs.install-check.result != 'success' && needs.install-check.result != 'skipped') || (needs.install-check.result == 'skipped' && needs.lanes.outputs.install != 'false')
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # K128 (build 17): the steps that judge this PR run the base commit's copy of their script, so a PR cannot change
      # the check that grades it (the recall gate already did). They come before any step that runs the PR's own code,
      # which could swap the unpacked copy or the tools (the build 17 sweep). The checks after them (scrub, words, maps,
      # links, the build) read the PR's content with its own tools; a change to those is in the diff, as the workflow is,
      # and the ruleset that stops a PR changing the workflow is the owner's (K31).
      - name: The base commit's scripts
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A replace ref would hand the PR's own blob back as the base's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          # Git for Windows' tar reads "D:" in a Windows path as a host (PR 53), so it gets the path in its own form.
          B="$RUNNER_TEMP/base"; command -v cygpath > /dev/null && B="$(cygpath -u "$B")"
          mkdir -p "$B"
          git archive "$BASE_SHA" scripts project tests user | tar -x -C "$B"

      # The local hooks check names at commit and push; a commit made elsewhere (the web, a cloud session) skips
      # them, so the PR's branch and every commit on it are checked here too.
      - name: Branch and commit names
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: origin/${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          N="$RUNNER_TEMP/base/project/.claude/name-check.mjs"; [ -f "$N" ] || { echo "the base has no name-check.mjs: this PR's copy runs"; N=project/.claude/name-check.mjs; }
          node "$N" branch "$HEAD_REF"
          # The squash subject is the title with " (#n)" added: that whole line is held to the limit.
          node "$N" title "$PR_TITLE (#$PR_NUMBER)"
          # K244: who each commit is by, author and committer, held to the same check as the commit-msg hook (a commit
          # made with --no-verify, on the web or in a cloud session skipped that hook).
          I="$RUNNER_TEMP/base/project/.claude/name-check.mjs"; grep -q "mode === 'ident'" "$I" 2> /dev/null || { echo "the base has no author check in name-check.mjs: this PR's copy runs"; I=project/.claude/name-check.mjs; }
          # The build 23a sweep: a merge commit is checked for who made it too; its message is git's own.
          for c in $(git rev-list "$PR_BASE..$PR_HEAD"); do
            if [ -z "$(git rev-list --no-walk --merges "$c")" ]; then
              git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg.txt"
              node "$N" message "$RUNNER_TEMP/msg.txt" || { echo "commit $c"; exit 1; }
            fi
            GIT_AUTHOR_NAME="$(git log -1 --format=%an "$c")" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$c")" \
              GIT_COMMITTER_NAME="$(git log -1 --format=%cn "$c")" GIT_COMMITTER_EMAIL="$(git log -1 --format=%ce "$c")" \
              node "$I" ident || { echo "commit $c"; exit 1; }
          done

      # The pre-commit secret check runs only on the owner's machine; this scans every line and file the PR adds with
      # the same patterns, and never prints a value.
      - name: Secret scan
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: |
          S="$RUNNER_TEMP/base/project/.claude/secret-shapes.mjs"; [ -f "$S" ] || { echo "the base has no secret-shapes.mjs: this PR's copy runs"; S=project/.claude/secret-shapes.mjs; }
          node "$S" "$PR_BASE"

      # T15 D5: a PR that moves VERSION carries its build record, whole, and the changelog entry it writes.
      - name: Build record
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: origin/${{ github.base_ref }}
        # K105 (the build 14 sweep): a change install reads moves VERSION, so its fix ledger is read; the base's own rule
        # says which changes those are (K9).
        run: |
          git show "$PR_BASE:scripts/pr-scope.mjs" > "$RUNNER_TEMP/pr-scope.mjs" 2>/dev/null || printf '%s\n' 'process.stdout.write("install=true\n")' > "$RUNNER_TEMP/pr-scope.mjs"
          B="$RUNNER_TEMP/base/scripts/build-record.mjs"; [ -f "$B" ] || { echo "the base has no build-record.mjs: this PR's copy runs"; B=scripts/build-record.mjs; }
          if git diff --quiet "$PR_BASE" HEAD -- VERSION; then node "$RUNNER_TEMP/pr-scope.mjs" --install "$PR_BASE" | grep -qx 'install=false' || { echo "This PR changes what install reads: move VERSION and add its build record"; exit 1; }; echo "VERSION unchanged: no build record owed"; else KIT_RECORD_ROOT=. node "$B" check; fi

      # K135 (build 18): the six content checks below run the base commit's copies too, over the PR's tree, so this job
      # runs none of the PR's code (on a push to main, each runs its own copy). The test check, which must run the PR's
      # tests, stays in its own job: a results file from that job could be forged by those tests, a limit the owner named.
      - name: Scrub
        shell: bash
        run: |
          K="$RUNNER_TEMP/base/scripts/kit.mjs"; grep -qs KIT_CHECK_ROOT "$K" || { echo "the base has no kit.mjs that reads another tree: this PR's copy runs"; K=scripts/kit.mjs; }
          KIT_CHECK_ROOT=. node "$K" scrub

      # One name for each thing the guards and rules talk about (T16a): a banned variant fails here.
      - name: Word check
        shell: bash
        run: |
          W="$RUNNER_TEMP/base/scripts/word-check.mjs"; [ -f "$W" ] || { echo "the base has no word-check.mjs: this PR's copy runs"; W=scripts/word-check.mjs; }
          node "$W" .

      # Every part the map names exists, every link joins known parts, every "done" has evidence.
      - name: Project map
        shell: bash
        run: |
          P="$RUNNER_TEMP/base/project/.claude/project-map.mjs"; [ -f "$P" ] || { echo "the base has no project-map.mjs: this PR's copy runs"; P=project/.claude/project-map.mjs; }
          node "$P" check

      # T8: which rule each guard, script, test and workflow names; the rules diet reads it, so a stale map fails here.
      - name: Rule map is fresh
        shell: bash
        run: |
          M="$RUNNER_TEMP/base/scripts/rule-map.mjs"; [ -f "$M" ] || { echo "the base has no rule-map.mjs: this PR's copy runs"; M=scripts/rule-map.mjs; }
          node "$M" check

      # No symlink or junction in the repo points outside it. The scan only reports, so the count decides here.
      - name: Link scan
        shell: bash
        run: |
          L="$RUNNER_TEMP/base/project/.claude/link-scan.cjs"; [ -f "$L" ] || { echo "the base has no link-scan.cjs: this PR's copy runs"; L=project/.claude/link-scan.cjs; }
          out="$(node "$L" .)"
          echo "$out"
          echo "$out" | grep -q 'links OUTSIDE: 0$'

      # The built copies (AGENTS.md, the project rule files) must match their sources.
      - name: Build is fresh
        shell: bash
        run: |
          K="$RUNNER_TEMP/base/scripts/kit.mjs"; grep -qs KIT_CHECK_ROOT "$K" || { echo "the base has no kit.mjs that reads another tree: this PR's copy runs"; K=scripts/kit.mjs; }
          KIT_CHECK_ROOT=. node "$K" build
          git diff --exit-code

      # N11: every workflow is linted, its expressions and its shell steps. The release file is pinned by its sha256, so
      # a replaced download fails here before it runs.
      - name: Workflow lint
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      # Rule text is graded by the recall test, which needs a signed-in session and is run by hand; a PR that
      # changes the rules, the keys, the brief or the harness must record a median no lower than the released baseline or the keys' pass bar.
      - name: Rule changes carry a passing recall score
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        # The base branch's gate judges the PR, so a PR cannot loosen the check it is graded by. It sits beside the
        # PR's copy so it finds the repo the same way; it reads the ruler from the PR's head commit.
        run: |
          git show "$PR_BASE:scripts/recall.mjs" > scripts/recall-gate-base.mjs
          node scripts/recall-gate-base.mjs gate "$PR_BASE" "$PR_HEAD"

      # CI-C: the merge path's jobs are timed here, and a job over 180 s fails this required check, named with its
      # slowest tests. The list is the run's own jobs, every one but this job and the --skip jobs (minimal-code, report
      # only), fetched whole: the pages are merged into one {jobs:[...]} answer. A failed fetch fails the step; an
      # unreadable answer fails the check.
      - name: Time budget of the run's jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" | jq -s '{total_count: .[0].total_count, jobs: [.[].jobs[]]}' > "$RUNNER_TEMP/jobs.json"
          node "$( [ -f "$RUNNER_TEMP/base/scripts/ci-budget.mjs" ] && echo "$RUNNER_TEMP/base/" )scripts/ci-budget.mjs" --jobs "$RUNNER_TEMP/jobs.json" --self kit-tests --skip minimal-code

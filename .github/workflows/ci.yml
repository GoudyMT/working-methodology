# The kit's merge gate: the tests a change reaches, the scrub and a fresh build. The PR body has its own workflow
# (pr-body.yml), so a body edit reruns only that. The suite on Linux; the Windows-only tests and the guard proofs on
# Windows (E31). T15 (the owner's pick 2026-11-12, "Only what it touches"): a PR runs the tests its change reaches and
# the security set; every push to main runs the whole suite and saves the coverage map the next PR selects by.
# Actions are pinned to full commit SHAs, so a moved tag cannot change what runs here.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # E31: the suite runs on Linux, where it took 22 s against about 7 minutes on Windows (8 shards on the owner's PC,
  # 2026-11-09). The tests marked { windows: true } run on Windows (below), and are skipped here.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests read the v1.1.0 tag, and the version check diffs against main.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The temp repos the tests make need a commit identity, and main as the default branch, as on the owner's machine.
      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # Push to main: every test, through the guarded runner, recording the coverage map; the map is saved under this
      # commit, where the next PR on it finds it. Actions saves a cache from main where every PR into main can read it,
      # and no PR can write there.
      - name: Every test, with the coverage map
        if: github.event_name != 'pull_request'
        run: node scripts/test-run.mjs --map --shards 4

      - name: Save the coverage map
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.map.json
          key: test-map-${{ github.sha }}

      # A PR: the map main's push saved for the PR's base commit.
      - name: Load the coverage map for the base commit
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.map.json
          key: test-map-${{ github.event.pull_request.base.sha }}

      # Changed, or the whole suite when the selection has nothing sound to stand on (no map for the base, a deleted
      # file, a change to a workflow, the runner, the harness or the map tracer).
      - name: What this PR runs
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/pr-scope.mjs "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Every test
        if: github.event_name == 'pull_request' && steps.scope.outputs.scope != 'changed'
        run: node scripts/test-run.mjs --shards 4

      - name: The tests the change reaches
        if: github.event_name == 'pull_request' && steps.scope.outputs.scope == 'changed'
        run: node scripts/test-run.mjs --changed --shards 4

      # The security set runs on every PR whatever the change reaches (E32 rule 4: security tests never move for speed).
      - name: The security set
        if: github.event_name == 'pull_request' && steps.scope.outputs.scope == 'changed'
        run: node scripts/test-run.mjs --shards 4 tests/guards-hold.test.mjs tests/guards-outside.test.mjs tests/owner-proof.test.mjs tests/task-gate.test.mjs tests/guard-dispatch.test.mjs tests/guard-prompts.test.mjs

  # T15 Part A: each test the PR adds or changes, held to the bar for a new test. It reports to the run's summary and
  # is not required until the owner locks it.
  test-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Test check (report)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/test-check.mjs "$BASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  # What only the owner's machine shows: drive paths, Git for Windows' sh running the git hooks, junctions; and the
  # guards' own proofs, since the guards guard a Windows machine.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Vendor paths are long; without this a deep checkout can pass the 260-character Windows limit.
      - run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The hook tests run `sh`; Git for Windows ships it in its bin folder (the runner's default branch is master).
      - name: Prepare the shell and git identity
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Windows tests
        env:
          KIT_WINDOWS_SLICE: '1'
        run: node scripts/test-run.mjs --shards 2

      # The push guard's own proof: every command that must ask asks, every safe one passes.
      - name: Push guard proof
        run: node project/.claude/guard-outward-check.cjs

      # The delete guard's own proof: every delete outside the session's folder and the project asks.
      - name: Delete guard proof
        run: node project/.claude/guard-delete-check.cjs

  # E32 (option C, the owner 2026-11-10): two lanes on the same PR. The fast lane is unit-tests above; large tests
  # (another machine, a real service, a browser, a live model) live in tests/slow and run here, beside it. The slow
  # job is turned on by a job-level if on what this job finds, never by a path filter on the workflow, so a PR with no
  # slow test still gets a result for every required job.
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slow: ${{ steps.find.outputs.slow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: find
        shell: bash
        run: |
          if [ -n "$(find tests/slow -type f -name '*.test.mjs' 2>/dev/null | head -n 1)" ]; then echo "slow=true" >> "$GITHUB_OUTPUT"; else echo "slow=false" >> "$GITHUB_OUTPUT"; fi

  slow-tests:
    needs: [lanes]
    if: needs.lanes.outputs.slow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare git identity
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # A large test's own time limit is the large size's (900 s), not the fast lane's.
      - name: Slow tests
        shell: bash
        env:
          KIT_TEST_LIMIT_MS: '900000'
        run: node scripts/test-run.mjs $(find tests/slow -type f -name '*.test.mjs')

  # The required check. It runs even when a job it needs fails, and fails then: a job skipped because a job it needs
  # failed counts as passed for a required check. A slow lane skipped for having no test passes; one that ran must pass.
  kit-tests:
    needs: [unit-tests, windows-tests, lanes, slow-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every test job passed
        if: needs.unit-tests.result != 'success' || needs.windows-tests.result != 'success' || needs.lanes.result != 'success' || (needs.slow-tests.result != 'success' && needs.slow-tests.result != 'skipped')
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Scrub
        run: node scripts/kit.mjs scrub

      # One name for each thing the guards and rules talk about (T16a): a banned variant fails here.
      - name: Word check
        run: node scripts/word-check.mjs

      # Every part the map names exists, every link joins known parts, every "done" has evidence.
      - name: Project map
        run: node project/.claude/project-map.mjs check

      # No symlink or junction in the repo points outside it. The scan only reports, so the count decides here.
      - name: Link scan
        shell: bash
        run: |
          out="$(node project/.claude/link-scan.cjs .)"
          echo "$out"
          echo "$out" | grep -q 'links OUTSIDE: 0$'

      # The built copies (AGENTS.md, the project rule files) must match their sources.
      - name: Build is fresh
        shell: bash
        run: |
          node scripts/kit.mjs build
          git diff --exit-code

      # N11: every workflow is linted, its expressions and its shell steps. The release file is pinned by its sha256, so
      # a replaced download fails here before it runs.
      - name: Workflow lint
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      # The local hooks check names at commit and push; a commit made elsewhere (the web, a cloud session) skips
      # them, so the PR's branch and every commit on it are checked here too.
      - name: Branch and commit names
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: origin/${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node project/.claude/name-check.mjs branch "$HEAD_REF"
          # The squash subject is the title with " (#n)" added: that whole line is held to the limit.
          node project/.claude/name-check.mjs title "$PR_TITLE (#$PR_NUMBER)"
          for c in $(git rev-list --no-merges "$PR_BASE..$PR_HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg.txt"
            node project/.claude/name-check.mjs message "$RUNNER_TEMP/msg.txt" || { echo "commit $c"; exit 1; }
          done

      # The pre-commit secret check runs only on the owner's machine; this scans every line and file the PR adds with
      # the same patterns, and never prints a value.
      - name: Secret scan
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: node project/.claude/secret-shapes.mjs "$PR_BASE"

      # Rule text is graded by the recall test, which needs a signed-in session and is run by hand; a PR that
      # changes the rules, the keys, the brief or the harness must record a median no lower than the released baseline or the keys' pass bar.
      - name: Rule changes carry a passing recall score
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        # The base branch's gate judges the PR, so a PR cannot loosen the check it is graded by. It sits beside the
        # PR's copy so it finds the repo the same way; it reads the ruler from the PR's head commit.
        run: |
          git show "$PR_BASE:scripts/recall.mjs" > scripts/recall-gate-base.mjs
          node scripts/recall-gate-base.mjs gate "$PR_BASE" "$PR_HEAD"

# S1 (the build 23b sweep): a cloud build thread pushes its own feature branch, and a cloud session loads no pre-push
# hook, so the secret scan and the name check the PC runs at push never ran; the PR's scans come only once a PR is open,
# and this repo is public. Every push to a branch other than main runs main's copies of both, so the branch cannot
# change the check that reads it. About one minute a push.
# Actions are pinned to full commit SHAs, so a moved tag cannot change what runs here.
name: Branch push

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: branch-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Main's scripts
        shell: bash
        env:
          # A replace ref would hand the branch's own blob back as main's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/main"
          git archive origin/main project/.claude | tar -x -C "$RUNNER_TEMP/main"

      # Every line and file the branch adds past main, with the pre-commit hook's patterns; never prints a value.
      - name: Secret scan
        shell: bash
        run: |
          node "$RUNNER_TEMP/main/project/.claude/secret-shapes.mjs" origin/main

      - name: Branch and commit names
        shell: bash
        run: |
          node "$RUNNER_TEMP/main/project/.claude/name-check.mjs" branch "$GITHUB_REF_NAME"
          for c in $(git rev-list --no-merges origin/main..HEAD); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg.txt"
            node "$RUNNER_TEMP/main/project/.claude/name-check.mjs" message "$RUNNER_TEMP/msg.txt" || { echo "commit $c"; exit 1; }
          done

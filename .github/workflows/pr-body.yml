# The PR body audit, on its own (T15 D3): a body or title edit reruns only this, not the whole test run. The owner
# makes "pr-body" a required check beside "kit-tests".
name: PR body

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch, to see whether this PR moves VERSION.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # K128 (build 17): every step below that judges this PR runs the base commit's copy of its script, so a PR cannot
      # change the check that grades it (the recall gate already did). The workflow file itself still comes from the PR;
      # the ruleset that stops that is the owner's (K31).
      - name: The base commit's scripts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A replace ref would hand the PR's own blob back as the base's (the build 17 sweep).
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          # Git for Windows' tar reads "D:" in a Windows path as a host (PR 53), so it gets the path in its own form.
          B="$RUNNER_TEMP/base"; command -v cygpath > /dev/null && B="$(cygpath -u "$B")"
          mkdir -p "$B"
          git archive "$BASE_SHA" scripts project tests user | tar -x -C "$B"

      # The body and title come in through env, never into the script text, so a PR cannot inject commands.
      - name: PR body audit
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The base the audit reads the project's settings and the canary phrase from (the build 17 sweep).
          PR_BASE: origin/${{ github.base_ref }}
        run: |
          node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/pr-body.md', process.env.PR_BODY || '')"
          # Every title is type: subject now (1.25.0), so the body says which format it is: a Standard body has a
          # "### Summary" section, a Lean one does not.
          if grep -q '^### Summary$' "$RUNNER_TEMP/pr-body.md"; then
            A=pr-body-audit.mjs
          else
            A=pr-body-audit-lean.mjs
          fi
          P="$RUNNER_TEMP/base/project/.claude/$A"; [ -f "$P" ] || { echo "the base has no $A: this PR's copy runs"; P="project/.claude/$A"; }
          if node "$P" "$RUNNER_TEMP/pr-body.md" "$PR_TITLE" "$PR_NUMBER"; then :; else exit 1
          fi

      # K105 (the build 14 sweep): a PR that moves VERSION carries its build record; the body's fix lines must be the
      # ones that record writes, so a hand edit cannot claim more than the fix ledger holds.
      - name: The fix lines match the build record
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF" HEAD -- VERSION; then echo "VERSION unchanged: no build record to match"; else B="$RUNNER_TEMP/base/scripts/build-record.mjs"; [ -f "$B" ] || { echo "the base has no build-record.mjs: this PR's copy runs"; B=scripts/build-record.mjs; }; KIT_RECORD_ROOT=. node "$B" body "$RUNNER_TEMP/pr-body.md"; fi

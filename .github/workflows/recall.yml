# The recall test in CI (T15 D6, the owner's locks 2026-11-12: "CI model run", reached by workload identity
# federation, no stored key). Kit only: recall grades the kit's own rule text; no project runs it.
#
# It reports, and gates nothing yet: the typed recall gate in ci.yml stays until this run is shown to catch at least
# what the typed one catches, and retiring it is the owner's lock.
#
# Run by hand from main (Actions, Recall, Run workflow), naming the branch to measure: a run spends model tokens, so
# it is the owner's act, never a push or PR trigger. The federation rule admits only this repo's main ref, so a
# workflow edited on a branch cannot get a token. It stays off until the owner sets the federation variables.
name: Recall

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to measure (its rule text is the candidate)
        required: true

permissions:
  contents: read

concurrency:
  group: recall
  cancel-in-progress: false

jobs:
  recall:
    if: github.ref == 'refs/heads/main' && vars.ANTHROPIC_FEDERATION_RULE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # The GitHub token that federation swaps for a short-lived Anthropic one; nothing else is granted.
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      OIDC_AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE }}
      MEASURE_REF: ${{ inputs.ref }}
    steps:
      # The harness, keys and brief are main's (the base judges, as the typed gate does); the candidate is data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cand
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare git identity and Claude Code
        shell: bash
        run: |
          git config --global user.name "kit-ci"
          git config --global user.email "kit-ci@users.noreply.github.com"
          git config --global init.defaultBranch main
          npm install --global --ignore-scripts @anthropic-ai/claude-code@2.1.302

      # The released kit at its newest tag: the baseline side, and the user layer every session loads.
      - name: Released kit and user layer
        shell: bash
        run: |
          tag="$(git -C base tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          git clone --quiet --no-hardlinks --branch "$tag" base released
          node released/scripts/kit.mjs install user
          echo "Baseline and user layer: $tag"

      # GitHub's token lives minutes; it is written again every 4 minutes while the run lasts, and never printed.
      - name: Federation token
        shell: bash
        run: |
          token_file="$RUNNER_TEMP/oidc-token"
          fetch() { curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))" > "$token_file.new" && mv "$token_file.new" "$token_file"; }
          fetch
          ( while sleep 240; do fetch || true; done ) > /dev/null 2>&1 &
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      # Three candidate runs, three baseline runs and one control, through main's harness.
      - name: Recall runs
        shell: bash
        run: |
          for i in 1 2 3; do node base/scripts/recall.mjs "cand-$i" cand; done
          for i in 1 2 3; do node base/scripts/recall.mjs "base-$i" released; done
          node base/scripts/recall.mjs control-1 --no-kit

      # One fresh blind scorer under main's brief, then the gate line from the sealed map: no number is typed.
      - name: Blind score
        shell: bash
        run: |
          out="$RUNNER_TEMP/recall"
          node base/scripts/recall-score.mjs blind "$out" base/reports/evals/*.md
          brief="$(cat base/docs/evals/recall-scorer-brief.md)"
          keys="$(cat base/docs/evals/recall-questions.md)"
          ( cd "$out/scorer" && claude -p "$(printf '%s\n\n%s\n\n%s\n' "$brief" "$keys" 'Score every run file R*.md in this folder under the current brief and keys above.')" \
              --setting-sources project --allowedTools 'Read,Glob' --disallowedTools 'Edit,Write,Bash,WebFetch,WebSearch,Agent' --max-turns 60 ) > "$out/scorer.txt"
          label="ci-$(printf '%s' "$MEASURE_REF" | tr -c 'A-Za-z0-9.-' '-')"
          node base/scripts/recall-score.mjs score "$out/scorer.txt" "$out/sealed-map.json" "$label" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recall-runs
          path: |
            base/reports/evals
            ${{ runner.temp }}/recall
          retention-days: 30

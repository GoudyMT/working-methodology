# The kit's CI shape for a Python project (K44). Copy to .github/workflows/ci.yml and fill the <...> slots.
# Shape: PR and main-push triggers, never both on one push; stale runs cancelled; two lanes; one required check
# ("ci"); main runs everything. Check what is missing with: node .claude/ci-shape.mjs
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: <"3.12">
          cache: pip
      - run: <pip install -r requirements.txt>
      # K72: a tracked settings file that turns every hook off turns the kit's guards off with no sign.
      - name: Hooks stay on
        run: |
          # Read as JSON, as Claude Code reads it: a text match misses an escaped key; a file that does not parse fails.
          for f in .claude/settings.json .claude/settings.local.json; do
            [ -f "$f" ] || continue
            python3 -c 'import json,sys; s=json.load(open(sys.argv[1], encoding="utf-8-sig")); sys.exit(1 if isinstance(s, dict) and s.get("disableAllHooks") is True else 0)' "$f" || { echo "disableAllHooks is true in $f, or it is not JSON"; exit 1; }
          done
      # K341: an override in .kit/models.json may not lower a step below its floor or change a never-drop step.
      # The runner ships node, so this step needs no setup.
      - run: node .claude/model-override.mjs check
      # A PR may narrow this run to what the change reaches (pytest --testmon) once the narrowed run has missed
      # nothing beside the whole suite; main always runs it whole. Lanes go by folder: a conftest.py hook marks each
      # test in the slow-lane folder "slow", the markers are registered, and --strict-markers fails an unknown one.
      # Workers inside the job first (pytest-xdist -n auto: no extra job). Once the tests take over about 2 to 3
      # minutes, shards: a matrix with pytest-split, which packs by its stored durations so they finish together (K123).
      # On a private repo each shard is a billed job.
      - run: <pytest -m "not slow" --strict-markers>
  lanes:
    # A job-level if cannot read files, so this job looks for a slow test and says so (as the kit's own CI does).
    runs-on: ubuntu-latest
    outputs:
      slow: ${{ steps.find.outputs.slow }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: if [ -n "$(find tests/slow -type f 2>/dev/null | head -n 1)" ]; then echo slow=true >> "$GITHUB_OUTPUT"; else echo slow=false >> "$GITHUB_OUTPUT"; fi
  slow:
    # The slow lane, on by a job-level if when its folder holds a test, never a workflow path filter.
    needs: lanes
    if: needs.lanes.outputs.slow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: <"3.12">
      - run: <pip install -r requirements.txt>
      - run: <pytest -m slow --strict-markers>
  ci:
    # The one required check: it fails if any lane failed, and passes when the slow lane had nothing to run.
    needs: [fast, lanes, slow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.fast.result }}" = success ] && [ "${{ needs.lanes.result }}" = success ] || exit 1
          case "${{ needs.slow.result }}" in success|skipped) ;; *) exit 1;; esac

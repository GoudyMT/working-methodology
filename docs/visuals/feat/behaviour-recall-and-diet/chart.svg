<svg xmlns="http://www.w3.org/2000/svg" width="760" height="656" viewBox="0 0 760 656" font-family="Segoe UI, Arial, sans-serif"><rect width="760" height="656" fill="#ffffff"/><text x="16" y="30" font-size="16" font-weight="600" fill="#1c211e">Every session starts with 1,100 fewer tokens: about $4.40 less per 1,000 sessions at</text><text x="16" y="50" font-size="16" font-weight="600" fill="#1c211e">the uncached input price, and 4.33 points more of the window used at start (the window</text><text x="16" y="70" font-size="16" font-weight="600" fill="#1c211e">went from 650,000 to 400,000 tokens).</text><text x="16" y="106" font-size="14" font-weight="600" fill="#1c211e">Always-loaded rules file</text><text x="744" y="106" font-size="14" font-weight="600" text-anchor="end" fill="#1f7a4a">-3,775 B (-13.7%)</text><line x1="540.4" y1="112" x2="540.4" y2="166" stroke="#b4442f" stroke-width="2" stroke-dasharray="4 3"/><text x="540.4" y="178" font-size="11" text-anchor="middle" fill="#b4442f">limit 25,000 B</text><text x="16" y="130" font-size="12" fill="#5b655f">Before</text><rect x="92" y="116" width="495.2" height="20" rx="3" fill="#b8c4bc"/><rect x="591.2" y="116" width="72" height="20" fill="#ffffff"/><text x="595.2" y="131" font-size="13" fill="#1c211e">27,609 B</text><text x="16" y="156" font-size="12" fill="#5b655f">After</text><rect x="92" y="142" width="427.5" height="20" rx="3" fill="#2f5d46"/><rect x="523.5" y="142" width="72" height="20" fill="#ffffff"/><text x="527.5" y="157" font-size="13" fill="#1c211e">23,834 B</text><text x="16" y="198" font-size="14" font-weight="600" fill="#1c211e">Always-loaded rules file: tokens read at each session start</text><text x="744" y="198" font-size="14" font-weight="600" text-anchor="end" fill="#1f7a4a">-1,300 (-13.3%)</text><text x="16" y="222" font-size="12" fill="#5b655f">Before</text><rect x="92" y="208" width="495.2" height="20" rx="3" fill="#b8c4bc"/><rect x="591.2" y="208" width="48" height="20" fill="#ffffff"/><text x